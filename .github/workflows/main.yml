
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q pluck-android.zip -d android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Pluck.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Pluck APK
          files: Pluck.apk
